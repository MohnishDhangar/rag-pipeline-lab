name: tests
on:
  push:
    branches: [main, feature/adaptive-rag-gpt-oauth]
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e '.[rag,dev]'
      - name: Compile Python modules
        run: python -m compileall -q rag_lab
      - name: Run unit tests
        run: python -m pytest -q
