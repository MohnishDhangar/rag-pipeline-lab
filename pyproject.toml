[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag_lab"
version = "0.2.0"
description = "Adaptive scientific RAG with provenance-preserving evaluation"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyJWT[crypto]>=2.8",
    "langchain-core>=0.3",
    "pydantic>=2",
]

[project.optional-dependencies]
rag = [
    "langchain-classic>=1",
    "langchain-google-genai",
    "langchain-chroma",
    "pypdf",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]
colbert = ["pylate"]
dashboard = ["streamlit>=1.38", "pandas>=2"]
evaluation = ["ragas"]
dev = ["pytest>=8", "scikit-learn>=1.3", "joblib>=1.3"]

[tool.setuptools.packages.find]
include = ["rag_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
